data_provider: "gee" # Choose from "gee" or "cds". In both cases its assumed that the necessary libraries are preinstalled in the conda env. xxxx Writing code for gee for now now

save_gee_data: false # Choose from true or false. This is only for data from earth engine: era5, era5land, other dynamic or static datasets. 

data_name: "era5land" # Choose from "era5", "era5land" or "others". The option "others" assumes you have downlaoded the data. xxxx Writing code for era5land only for now

# In the following, add -"var_name" in new line from band list at one of the following:
# hourly data: most bands on https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_HOURLY#bands
# daily data: minimal bands ahve been aggregated already https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_DAILY#bands
# monthly data: minimal bands ahve been aggregated already https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_MONTHLY#bands
era5:
  era5_vars: 
    - "mean_2m_air_temperature"
    - "total_precipitation"
    - "surface_solar_radiation_downwards"

# Similar can add variables to  downlaod and aggregate from the following:
# Hourly data: https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_HOURLY#bands
# Daily data: Same vars from hourly. Also includes mean, min and max aggregates directly: https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_DAILY_AGGR#bands
# Monthly: bands simialr to daily
# Monthly data: https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_MONTHLY_AGGR#bands
era5land:
  era5land_vars:
    - "temperature_2m"
    - "total_precipitation_sum"
    - "surface_solar_radiation_downwards_sum"
    # - "snowfall_sum"
    # - "surface_net_solar_radiation_sum"
