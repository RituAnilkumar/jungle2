area_mode: "reg_num" # Choose "shp", "reg_num" or "bbox". "shp" is to be selected if you have your own area of interest. "reg_num" if you are using the rgi7 regions number, "bbox" if you are providing coordinates of a bounding box

shp:
  shp_path: "C:\\Users\\jz25104\\OneDrive - University of Bristol\\Desktop\\Misc_to_del\\del.shp" # The path to the are of interest file in shp format

reg_num:
  rgi_code: "17" # Use the "nn" form of the number and pass as a string. For eg "06" is Iceland

bbox:
  bbox_coords: # Coordinates in LowerLat,UpperLat,LowerLon,UpperLon as float format. Longitudes are from -180 to 180. Lats are from -90 to 90
    - 25.0
    - 28.0
    - 75.0
    - 90.0


