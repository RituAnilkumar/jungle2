## --------------------------------------------- ##
## ---------- Aggregation Information ---------- ##
## --------------------------------------------- ##
temporal_freq_aggregate: null # Choose the temporal frequency to aggregagte met data from "Y" or "M" which stands for year or month respectively. Choose null for no aggregation
spatial_aggregation_file: null # The path to the shapefile to aggregate over if its different from the rgi_attr_path. If same, leave as null
spatial_aggregation_opt: "sampling" # Uses rgi_attr_path.Choose from "sampling", "mean", "median". "sampling" is the only option for point shapefiles will pick the nearest pixel and add the meteoroligcal information to the shapefile attributes. All others are reducers which reduce over each of the features of the shapefile and include the meteoroligcal values as attribute information aggregated over the feature
attr_geom: 'pt' # Choose from 'pt' or 'poly'. 'pt' for point shapefiles and 'poly' for polygon shapefiles. If pt, only sampling will work


