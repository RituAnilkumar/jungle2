## w5e5 annual
inp_dir: "/scratch/b5at/ranil.b5at/data_prep_tools/data_for_model/w5e5runs/annual/" # don't use training /
## era5l annual annminmax
# inp_dir: "/scratch/b5at/ranil.b5at/data_prep_tools/data_for_model/data_for_model_annminmax/"
reg_subdir: "r06"

model_nlayers: 2
model_nhidden: 32
model_freq: "Y"
model_nepochs: 5000
model_nensemble: 15
# NOTE YEAR HAS TO BE THE FIRST FEATURE IN THE LIST. GET THE FULL FT LIST FROM inp_dir/reg_subdir any csv file. Below in rm_fts, INCLUDE ONLY THOSE YOU DONT WANT. This is easier for hydra multiruns. In standardize_fts I include all but the year.

# model_ftcols: ['year', 'CenLon', 'CenLat', 'Slope', 'Area','Aspect', 'Zmed', 'Zmin', 'Zmax', 'tas_mean', 'tas_median', 'tas_min','tas_max', 'tas_std', 'rsds_mean', 'rsds_median', 'rsds_min','rsds_max', 'rsds_std', 'pr_sum']
model_ftcols: ['year', 'CenLon', 'CenLat', 'Slope', 'Area','Aspect', 'Zmed', 'Zmin', 'Zmax', 'tas_median', 'tas_std', 'pr_sum', 'rsds_median', 'rsds_std']
model_targcols: "mass_balance"

rm_fts: []  # remove features from model_ftcols if any

model_obsmode: "NORMAL"
use_stdscalar: false
seasonality_periods: [5,10]
num_seasonal_harmonics: [2,4]
model_traintype: "VI" # choose from "MAP", "VI" and "MLE"
