## --- Target Information --- ##
training_mode: "pretraining_oggm" # one of: "pretraining_oggm", "finetuning_hug", "finetuning_glam_altgrav", "finetuning_combined", "standalone_hug", "standalone_glam_altgrav", "standalone_combined". TO DO: Add finetuning and standalone for glambie inputs

# File paths to targets
target_path_oggm: 'data_for_model/targets_oggm_annual_pergla_iceland.csv' #used for oggm pretraining and finetunings
# target_path_hug: "data_for_model/targets_hug_20yr_pergla_iceland.csv"
# target_path_alt: "data_for_model/targets_glam_alt_annual_reg_iceland.csv"
# target_path_grav: "data_for_model/targets_glam_grav_annual_reg_iceland.csv"
target_path_hug: "data_for_model/targets_oggm_20yr_pergla_iceland.csv"
target_path_alt: "data_for_model/targets_oggm_annual_reg_iceland.csv"

## --- Input Information --- ##
inp_ft_mode: "monthly_calendar" # one of: "monthly_hydrological_nh","monthly_hydrological_sh", "monthly_calendar", "annual_hydrological_nh", "annual_hydrological_sh", "annual_calendar"

inp_ft_path: "data_for_model/input_feats_t2m_tp_ssrd_wind_tminmaxstd_ssrdminmaxstd_deb_ndsi_ar_asp_slp_zmedminmax1999_2021.csv"

input_features: # Uncomment from below. IF writing afresh, choose from cenlon, cenlat, year, area_km2, zmin_m, zmax_m, zmed_m, slope_deg, aspect_deg, snowfall_sum, surface_net_solar_radiation_max, surface_net_solar_radiation_min, surface_net_solar_radiation_sum, surface_solar_radiation_downwards_max, surface_solar_radiation_downwards_min, surface_solar_radiation_downwards_sum, temperature_2m, temperature_2m_max, temperature_2m_min, total_precipitation_sum, u_component_of_wind_10m, v_component_of_wind_10m, NDSI
  - "Area"
  - "Zmed"
  - "Slope"
  - "Aspect"
  - "perc_deb"
  - "surface_solar_radiation_downwards_sum"
  - "temperature_2m"
  - "total_precipitation_sum"
  - "temperature_2m_std"
  - "surface_solar_radiation_downwards_std"
  # - "NDSI"
  # - "u_component_of_wind_10m"
  # - "v_component_of_wind_10m"
  # - "cenlon"
