# Dataset descriptor — Iceland ERA5 glacier mass balance
#
# To add a new dataset, create another file in configs/data/ and
# switch via:  python main.py data=<your_file>

path: /scratch/b5at/ranil.b5at/geoUQnet/data/iceland_era5_sampled.csv

feature_cols:
