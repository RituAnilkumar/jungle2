# gla_prep — root config
#
# Prepares glacier mass balance targets, samples climate features from
# met_prep NetCDF outputs, merges RGI static attributes, and writes
# ready-to-use CSV files for the modeling directory.
#
# Output CSVs are written into Hydra-managed directories under output_path:
#
#   Single run  →  {output_path}/{target}/
#   Multirun    →  {output_path}/multirun/{date}_{time}/{swept_params}/
#
#   e.g.  {output_path}/temporal_avg/
#           main_features_rNN.csv
#           temporal_avg_targets_rNN.csv
#
# Override any group from CLI:
#   python main.py target=wgms region=r06
#   python main.py target=temporal_avg region=r01 output_path=/my/outputs
#   python main.py -m region=r01,r02,r03,r04,r05,r06   # multirun over regions

defaults:
  - target: oggm
  - region: r06
  - _self_

output_path: /scratch/b5at/ranil.b5at/gla_prep/outputs

# Base path to the directory containing RGI attribute CSV files.
# Region yamls reference individual files as ${rgi_base_path}/NN_rgi60_RegionName.csv.
# RGI 6.0 CSV files: nsidc0770_00.rgi60.attribs/  (https://nsidc.org/data/nsidc-0770)
# RGI 7.0 SHP files: RGI2000-v7.0-G/              (https://nsidc.org/data/nsidc-0770)
rgi_base_path: /scratch/b5at/ranil.b5at/met_raw/rgi/nsidc0770_00.rgi60.attribs

# Base path to the met_prep NetCDF output — WITHOUT .nc extension.
# met_prep produces a single combined file (NH and SH aggregated per grid cell).
# Example: if met_prep outputs era5_seasonal.nc, set:
#   met_input_base_path: /path/to/met_prep/outputs/era5_seasonal
met_input_base_path: /scratch/b5at/ranil.b5at/met_prep/outputs/era5_seasonal

# Temporal aggregation level of the met_input files.
# Must match the aggregation mode used when running met_prep.
# Options:
#   monthly          — one value per calendar month       (time coord: time)
#   seasonal         — ablation + accumulation seasons    (time coord: season_year)
#   annual_calendar  — Jan–Dec annual aggregates          (time coord: time)
#   annual_hydro     — hydrological year aggregates       (time coord: hydro_year)
#                      NH: Oct–Sep  |  SH: Apr–Mar
met_input_freq: seasonal

# RGI static attribute columns to include in main_features.csv.
# rgi_id, CenLat, CenLon are always included regardless of this list.
# Available RGI 6.0 columns include:
#   Area, Zmin, Zmax, Zmed, Slope, Aspect, Lmax,
#   Status, Connect, Form, TermType, Surging, Linkages, Name
rgi_cols:
  - Area
  - Zmin
  - Zmax
  - Zmed
  - Slope
  - Aspect

hydra:
  run:
    dir: ${output_path}/${target.name}
  sweep:
    dir: ${output_path}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
