# Region 06 — Iceland
# RGI region code: 06

rgi_code: "06"

# Path to RGI attribute CSV or SHP for this region.
# CSV: nsidc0770_00.rgi60.attribs/<NN>_rgi60_<RegionName>.csv
# SHP: RGI2000-v7.0-G-<NN>_<regionname>/<NN>_<regionname>.shp
rgi_attr_path: /scratch/b5at/ranil.b5at/rgi/nsidc0770_00.rgi60.attribs/06_rgi60_Iceland.csv

# Format: "csv" or "shp"
rgi_format: csv

# Hemisphere — set to null to infer automatically from CenLat.
# Explicit override: "NH" or "SH"
hemisphere: null

# Path to met_prep NetCDF output to sample climate from.
# Must match the aggregation level used when running met_prep.
met_input_path: /scratch/b5at/ranil.b5at/met_prep/outputs/era5_seasonal.nc

# Temporal aggregation level of the met_input_path file.
# Tells the climate sampler which time coordinate to use for nearest-neighbour matching.
# Options: "monthly", "seasonal", "annual_calendar", "annual_hydro"
met_input_freq: seasonal
