# GLAMBIE regional mass balance target
# Source: GLAMBIE (Glacier Mass Balance Intercomparison Exercise)
# https://glambie.org
#
# One CSV file per RGI region, named {N}_{region_name}.csv
# (N = non-zero-padded RGI region number, e.g. 6_iceland.csv for r06)
#
# Extracts combined, altimetry, and gravimetry columns. If a method has no
# data for a region its columns will be present but filled with NaN.
# demdiff/glaciological columns are not included.

name: glambie

# Directory containing per-region GLAMBIE CSV files.
# Files are matched by non-padded region number prefix: {N}_*.csv
data_dir: /scratch/b5at/ranil.b5at/glacier_data/glambie

# Column name mappings for time and region — adjust if your GLAMBIE file differs.
region_col:     region
start_date_col: start_dates   # fractional year, e.g. 1999.75
end_date_col:   end_dates     # fractional year, e.g. 2000.75

# Unit preference: "gt" or "mwe"
# Selects {method}_gt / {method}_gt_errors  or  {method}_mwe / {method}_mwe_errors
# for combined, altimetry, and gravimetry.
units: gt
