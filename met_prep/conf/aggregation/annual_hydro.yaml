# Annual hydrological-year aggregation
#
# NH: Oct-Sep (year label = the year in which Sep falls)
# SH: Apr-Mar (year label = the year in which Mar falls)
#
# IMPORTANT — for global datasets, run met_prep TWICE:
#   python main.py aggregation=annual_hydro aggregation.hemisphere=NH
#   python main.py aggregation=annual_hydro aggregation.hemisphere=SH
# gla_prep then picks the correct file per glacier based on its CenLat.
#
# For single-hemisphere datasets, set hemisphere explicitly to "NH" or "SH".
# Leaving hemisphere: null defaults to NH globally and logs a warning.

name: annual_hydro

# Set to "NH" or "SH". See note above — null defaults to NH with a warning.
hemisphere: null

# NH hydrological year: starts October, ends September.
nh:
  start_month: 10   # October

# SH hydrological year: starts April, ends March.
sh:
  start_month: 4    # April

# Statistics for temperature per hydrological year. Precip and radiation summed.
temp_stats: [mean, min, max, std]
