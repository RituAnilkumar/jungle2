# Annual hydrological-year aggregation
#
# NH: Oct-Sep  (hydro_year N = Oct(N-1) – Sep(N))
# SH: Apr-Mar  (hydro_year N = Apr(N-1) – Mar(N))
# Label = the year in which the hydrological year ends.
#
# NH and SH definitions are applied per grid cell (lat >= 0 → NH) and
# combined into a single output file. No need to run twice.

name: annual_hydro

# NH hydrological year: starts October, ends September.
nh:
  start_month: 10   # October

# SH hydrological year: starts April, ends March.
sh:
  start_month: 4    # April

# Statistics for temperature per hydrological year. Precip and radiation summed.
temp_stats: [mean, min, max, std]
