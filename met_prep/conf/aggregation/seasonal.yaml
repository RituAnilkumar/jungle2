# Seasonal aggregation — ablation and accumulation seasons
#
# NH defaults: ablation May-Sep, accumulation Oct-Apr
# SH defaults: ablation Nov-Mar, accumulation Apr-Oct
#
# IMPORTANT — for global datasets, run met_prep TWICE:
#   python main.py aggregation=seasonal aggregation.hemisphere=NH
#   python main.py aggregation=seasonal aggregation.hemisphere=SH
# This produces two output files (e.g. w5e5_seasonal_NH.nc, w5e5_seasonal_SH.nc).
# gla_prep then picks the correct file per glacier based on its CenLat.
#
# For single-hemisphere datasets, set hemisphere explicitly to "NH" or "SH".
# Leaving hemisphere: null defaults to NH globally and logs a warning.

name: seasonal

# Set to "NH" or "SH". See note above — null defaults to NH with a warning.
hemisphere: null

# NH season month definitions (1-indexed). Override if needed.
nh:
  ablation_months:     [5, 6, 7, 8, 9]               # May-Sep
  accumulation_months: [10, 11, 12, 1, 2, 3, 4]      # Oct-Apr

# SH season month definitions. Override if needed.
sh:
  ablation_months:     [11, 12, 1, 2, 3]              # Nov-Mar
  accumulation_months: [4, 5, 6, 7, 8, 9, 10]        # Apr-Oct

# Statistics for temperature per season. Precip and radiation summed.
temp_stats: [mean]
